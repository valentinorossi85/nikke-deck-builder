<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel Arena Deck Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎮 Nivel Arena Deck Builder</h1>
        <nav>
            <a href="rules.md">Règles</a>
            <a href="#" onclick="alert('Aide: Cliquez sur une carte pour l\'ajouter au deck')">Aide</a>
        </nav>
    </header>

    <main>
        <section class="filters">
            <input type="text" id="searchInput" placeholder="Rechercher une carte...">
            <select id="ipFilter">
                <option value="all">Tous les types</option>
                <option value="Unit">Unités</option>
                <option value="Leader">Leaders</option>
                <option value="Skill">Compétences</option>
            </select>
             <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
        <input type="checkbox" id="leaderOnlyCheck" onchange="toggleLeaderFilter()">
        <span>Afficher seulement les Leaders</span>
    </label>
        </section>

        <div class="builder-container">
            <section class="card-pool">
                <h2>Cartes Disponibles (<span id="cardCount">0</span>)</h2>
                <div id="cardList" class="card-grid"></div>
            </section>

            <section class="deck-builder">
                <h2>Mon Deck</h2>
                
                <div id="deckStats" class="deck-stats">
                    <div class="stat">
                        <span class="stat-label">Cartes:</span>
                        <span class="stat-value">0/40</span>
                    </div>
                </div>

                <div class="deck-section">
                    <h3>Leader</h3>
                    <div id="leader-slot" class="leader-zone">
                        <!-- Le leader s'affichera ici -->
                        <p style="color: #888; font-size: 0.9em;">Glissez une carte ici ou double-cliquez dessus</p>
                    </div>
                </div>

                <h3>Cartes du deck</h3>
                <div id="deckList" class="deck-grid"></div>

                <div id="validationResult" class="validation"></div>

                <div class="actions">
                    <button id="exportBtn" class="btn btn-primary">Exporter</button>
                    <label class="btn btn-secondary">
                        Importer
                        <input type="file" id="importBtn" accept=".json" style="display: none;">
                    </label>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>Nivel Arena Deck Builder - Projet éducatif</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
