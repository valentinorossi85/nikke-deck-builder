<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel Arena Deck Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎮 Nivel Arena Deck Builder</h1>
        <nav>
            <a href="rules.md">Rules</a>
            <a href="#">Help</a>
        </nav>
    </header>

    <main>
        <div class="filters">
            <input type="text" id="searchInput" placeholder="Search for a card...">
            <select id="ipFilter">
                <option value="all">All Types</option>
                <option value="unit">Units</option>
                <option value="leader">Leaders</option>
                <option value="skill">Skills</option>
            </select>
            <!-- ✅ Checkbox compacte -->
            <div class="leader-filter-container">
                <input type="checkbox" id="leaderOnlyCheck" onchange="toggleLeaderFilter()">
                <label for="leaderOnlyCheck">👑 Hide non-Leader cards</label>
            </div>
        </div>

        <div class="builder-container">
            <div class="card-pool">
                <h2 id="availableCardsTitle">Available Cards (<span id="cardCount">0</span>)</h2>
                <div id="cardList" class="card-grid"></div>
            </div>

            <div class="deck-builder">
                <h2>My Deck</h2>
                <div id="deckStats" class="deck-stats">
                    <div>Cartes: <strong>0/40</strong></div>
                    <div>Leader: <strong>MANQUANT</strong></div>
                </div>

                <h3>Leader</h3>
                <div id="leader-slot" class="leader-zone">
                    <p style="color: #888; font-size: 0.9em; text-align: center; pointer-events:none;">
                        Drag a card here or double-click on it
                    </p>
                </div>

                <h3>Deck Cards</h3>
                <div id="deckList" class="deck-grid"></div>

                <div class="actions">
                    <button class="btn btn-primary" onclick="exportDeck()">Export</button>
                    <button class="btn btn-secondary" onclick="importDeck()">Import</button>
                </div>

                <div id="validationResult" class="validation invalid">
                    ❌ Deck Invalide (Il faut 1 Leader et 40 cartes)
                </div>
            </div>
        </div>
    </main>

    <!-- Modal pour les détails de carte -->
    <div id="cardModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModalDirect()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer>
        <p>Nivel Arena Deck Builder - Educational Project</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
