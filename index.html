<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Card Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Constructeur de Deck One Piece</h1>
        
        <div class="controls">
            <label class="checkbox-container">
                <input type="checkbox" id="leaderFilter" onchange="toggleLeaderFilter()">
                Masquer les cartes non-Leader
            </label>
            <button onclick="clearDeck()" class="btn-clear">Vider le Deck</button>
            <button onclick="saveDeck()" class="btn-save">Sauvegarder le Deck</button>
        </div>

        <div class="main-layout">
            <!-- Zone Gauche: Liste des cartes -->
            <div class="card-list-section">
                <h2>Liste des Cartes (<span id="cardCount">0</span>)</h2>
                <div id="searchBox">
                    <input type="text" id="searchInput" placeholder="Rechercher une carte..." onkeyup="filterCards()">
                </div>
                <div id="cardList" class="card-list"></div>
            </div>

            <!-- Zone Droite: Construction du Deck -->
            <div class="deck-builder-section">
                <div class="leader-zone-container">
                    <h3>Leader</h3>
                    <div id="leaderDropZone" class="drop-zone leader-drop" ondrop="drop(event, 'leader')" ondragover="allowDrop(event)">
                        <p>Glissez un Leader ici</p>
                    </div>
                    <div id="leaderInfo" class="card-info-panel"></div>
                </div>

                <div class="deck-zone-container">
                    <h3>Deck (<span id="deckCount">0</span>/50)</h3>
                    <p class="attribute-lock-msg" id="attributeLockMsg"></p>
                    <div id="deckDropZone" class="drop-zone deck-drop" ondrop="drop(event, 'deck')" ondragover="allowDrop(event)">
                        <p>Glissez des cartes ici</p>
                    </div>
                    <div id="deckList" class="deck-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Popup Modal -->
    <div id="cardModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModalDirect()">&times;</span>
            <div class="modal-body">
                <img id="modalImg" src="" alt="Card Image">
                <div class="modal-details">
                    <h2 id="modalName"></h2>
                    <p><strong>Type:</strong> <span id="modalType"></span></p>
                    <p><strong>Attribute:</strong> <span id="modalAttribute"></span></p>
                    <p><strong>Cost:</strong> <span id="modalCost"></span></p>
                    <p><strong>Power:</strong> <span id="modalPower"></span></p>
                    <p><strong>Effect (EN):</strong> <span id="modalEffect"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
